[pytest]
testpaths = tests
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
markers =
    smoke: fast checks of the most critical public pages and navigation
    regression: broader checks run before a release
    home: home page tests
    navigation: link / page-to-page navigation tests
    registration: registration page tests (never submits a valid account)
    login: login page tests (public, negative paths only)
    auth: authenticated tests - need SIVIKA_TEST_USERNAME / SIVIKA_TEST_PASSWORD, skipped otherwise
